name: srastemsya
x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-srastemsya}-runtime:local
  build: .
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
    interval: 3s
    timeout: 6s
    retries: 15
x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 2s
    timeout: 4s
    retries: 20
x-env: &env
  APP_ENV: ${APP_ENV:-production}
  ADMIN_JWT_KEY: ${ADMIN_JWT_KEY:-}
services:
  keys:
    image: ${COMPOSE_PROJECT_NAME:-srastemsya}-runtime:local
    build: .
    command: ["python", "keys.py"]
    volumes:
      - private-key:/private
      - public-key:/public
      - redis-acl:/acl
      - catalog-redis-key:/catalog
      - swipes-redis-key:/swipes
  identity:
    <<: *app
    environment:
      <<: *env
      SERVICE: identity
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD:-identity-local}@identity-db/identity
      IDENTITY_SECRET: ${IDENTITY_SECRET:-}
      MOCK_OTP: ${MOCK_OTP:-false}
    depends_on:
      identity-db: {condition: service_healthy}
      redis: {condition: service_healthy}
      keys: {condition: service_completed_successfully}
    volumes:
      - private-key:/keys:ro
  catalog:
    <<: *app
    environment:
      <<: *env
      SERVICE: catalog
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://catalog:${CATALOG_DB_PASSWORD:-catalog-local}@catalog-db/catalog
    depends_on:
      catalog-db: {condition: service_healthy}
      redis: {condition: service_healthy}
      keys: {condition: service_completed_successfully}
    volumes:
      - public-key:/keys:ro
      - catalog-redis-key:/redis-key:ro
  swipes:
    <<: *app
    environment:
      <<: *env
      SERVICE: swipes
      DATABASE_URL: postgresql://swipes:${SWIPES_DB_PASSWORD:-swipes-local}@swipes-db/swipes
    depends_on:
      swipes-db: {condition: service_healthy}
      redis: {condition: service_healthy}
      keys: {condition: service_completed_successfully}
    volumes:
      - public-key:/keys:ro
      - swipes-redis-key:/redis-key:ro
  identity-db:
    <<: *postgres
    environment:
      POSTGRES_USER: identity
      POSTGRES_DB: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity-local}
    volumes: [identity-db:/var/lib/postgresql/data]
  catalog-db:
    <<: *postgres
    environment:
      POSTGRES_USER: catalog
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-local}
    volumes: [catalog-db:/var/lib/postgresql/data]
  swipes-db:
    <<: *postgres
    environment:
      POSTGRES_USER: swipes
      POSTGRES_DB: swipes
      POSTGRES_PASSWORD: ${SWIPES_DB_PASSWORD:-swipes-local}
    volumes: [swipes-db:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--aclfile", "/acl/users.acl", "--appendonly", "yes"]
    volumes:
      - redis-acl:/acl:ro
      - redis:/data
    depends_on:
      keys: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "health", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 8s
      retries: 20
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${NGINX_PORT:-8080}:80"]
    depends_on:
      identity: {condition: service_healthy}
      catalog: {condition: service_healthy}
      swipes: {condition: service_healthy}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 3s
      timeout: 4s
      retries: 15
volumes:
  private-key:
  public-key:
  identity-db:
  catalog-db:
  swipes-db:
  redis:
  redis-acl:
  catalog-redis-key:
  swipes-redis-key:
  kafka:
