server {
    listen 80;
    access_log off;
    error_log /dev/null crit;
    resolver 127.0.0.11 valid=2s ipv6=off;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 35s;

    location = /health { return 200 "ok"; }
    location ~ ^/(identity|catalog|swipes)/(health|admin)$ {
        set $service $1;
        set $endpoint $2;
        proxy_pass http://$service:8000/$endpoint;
    }
    location ~ ^/v1/(auth/|me(?:/|$)) {
        set $service identity;
        proxy_pass http://$service:8000;
    }
    location ~ ^/v1/(home$|catalog/|events(?:/|$)) {
        set $service catalog;
        proxy_pass http://$service:8000;
    }
    location ~ ^/v1/(feed/|rooms(?:/|$)|room-invites/) {
        set $service swipes;
        proxy_pass http://$service:8000;
    }
}
